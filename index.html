<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Indian Faces — Photography</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f2;
      color: #111;
    }

    /* NAVIGATION */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: rgba(245, 245, 242, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 1000;
    }

    .logo {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    nav a {
      color: #111;
      text-decoration: none;
      font-size: 13px;
      margin-left: 28px;
    }

    /* HERO */
    .hero {
      height: 100vh;
      min-height: 650px;
      display: flex;
      align-items: flex-end;
      padding: 0 6% 8%;
      background:
        linear-gradient(to top, rgba(0,0,0,.45), transparent 55%),
        url("/DSC_9970.JPG")
        center/cover no-repeat;
      color: white;
    }

    .hero-content {
      max-width: 800px;
    }

    .hero h1 {
      font-size: clamp(54px, 9vw, 130px);
      font-weight: 500;
      letter-spacing: -5px;
      line-height: .9;
    }

    .hero p {
      margin-top: 24px;
      font-size: 18px;
      letter-spacing: .5px;
    }

    /* INTRO */
    .intro {
      min-height: 70vh;
      display: flex;
      align-items: center;
      padding: 10%;
    }

    .intro h2 {
      max-width: 900px;
      font-size: clamp(38px, 6vw, 80px);
      font-weight: 400;
      letter-spacing: -3px;
      line-height: 1.05;
    }

    /* WORK */
    .work {
      padding: 0 6% 10%;
    }

    .section-title {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 35px;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .gallery img {
      width: 100%;
      height: 70vh;
      object-fit: cover;
      display: block;
    }

    .gallery img:nth-child(2) {
      margin-top: 15vh;
    }

    /* CONTACT */
    .contact {
      min-height: 65vh;
      padding: 10% 6%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .contact h2 {
      font-size: clamp(45px, 8vw, 110px);
      font-weight: 400;
      letter-spacing: -4px;
    }

    .contact a {
      margin-top: 30px;
      color: #111;
      font-size: 18px;
    }

    /* MOBILE */
    @media (max-width: 700px) {

      nav {
        padding: 0 5%;
      }

      nav a {
        margin-left: 12px;
        font-size: 12px;
      }

      .hero {
        padding: 0 5% 10%;
      }

      .hero h1 {
        letter-spacing: -3px;
      }

      .intro {
        padding: 18% 8%;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .gallery img {
        height: 65vh;
      }

      .gallery img:nth-child(2) {
        margin-top: 0;
      }

      .work {
        padding: 0 5% 18%;
      }

      .contact {
        padding: 15% 5%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">INDIAN FACES</div>

    <div>
      <a href="#work">Work</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>INDIAN<br>FACES</h1>
      <p>Photography · People · Stories</p>
    </div>
  </section>

  <section class="intro">
    <h2>
      Photographing people, places and moments that deserve to be remembered.
    </h2>
  </section>

  <section class="work" id="work">

    <div class="section-title">Selected Work</div>

    <div class="gallery">

      <img src="/DSC_8759.jpg">

      <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1600&q=85">

    </div>

  </section>

  <section class="contact" id="contact">

    <h2>Let's create<br>something memorable.</h2>

    <a href="mailto:hello@indianfaces.com">
      hello@indianfaces.com
    </a>

  </section>

</body>
</html>
